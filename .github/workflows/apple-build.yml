name: Apple platform build
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      capture_filter:
        description: Optional comma-separated locale/device/screen recapture paths
        type: string
        default: ''
permissions:
  contents: read
jobs:
  native:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Warm screenshot simulator
        run: python3 scripts/warm-simulator.py
      - name: Build and test
        run: bash scripts/build-macos.sh
      - name: Verify bundled localization
        run: |
          python3 scripts/localize.py --check
          python3 scripts/check-native-localizations.py
      - name: Save compiler-extracted localization catalog
        uses: actions/upload-artifact@v4
        with:
          name: RideGuard-localization-catalog
          path: Localization/Localizable.xcstrings
      - name: Capture real iPhone and iPad screenshots
        env:
          CAPTURE_FILTER: ${{ inputs.capture_filter }}
        run: |
          python3 -m venv build/capture-env
          build/capture-env/bin/pip install Pillow==11.3.0
          build/capture-env/bin/python scripts/capture-simulators.py
      - name: Capture Apple Watch companion
        if: ${{ !inputs.capture_filter }}
        run: python3 scripts/capture-watch.py
      - name: Upload build results and artwork
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RideGuard-build-and-assets
          path: |
            build/*.log
            build/*.xcresult/
            build/screenshots/
            Marketing/
            App/Assets.xcassets/
            RideGuard.xcodeproj/
          retention-days: 14
      - name: Upload screenshots separately
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RideGuard-screenshots
          path: build/screenshots/
          if-no-files-found: ignore
