name: Apple platform build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  native:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build and test
        run: bash scripts/build-macos.sh
      - name: Save compiler-extracted localization catalog
        uses: actions/upload-artifact@v4
        with:
          name: RideGuard-localization-catalog
          path: Localization/Localizable.xcstrings
      - name: Capture real iPhone and iPad screenshots
        run: python3 scripts/capture-simulators.py
      - name: Capture Apple Watch companion
        run: python3 scripts/capture-watch.py
      - name: Upload build results and artwork
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RideGuard-build-and-assets
          path: |
            build/*.log
            build/*.xcresult/
            build/screenshots/
            Marketing/
            App/Assets.xcassets/
            RideGuard.xcodeproj/
          retention-days: 14
      - name: Upload screenshots separately
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RideGuard-screenshots
          path: build/screenshots/
          if-no-files-found: ignore
