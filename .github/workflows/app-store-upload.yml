name: Upload signed iOS build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  upload:
    runs-on: macos-26
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Prepare project and isolated signing key
        run: |
          python3 scripts/create_asset_catalog.py
          sips --resampleHeightWidth 1024 1024 Marketing/app-icon-master.png --out App/Assets.xcassets/AppIcon.appiconset/AppIcon.png >/dev/null
          cp App/Assets.xcassets/AppIcon.appiconset/AppIcon.png Watch/Assets.xcassets/AppIcon.appiconset/AppIcon.png
          xcodegen generate
          python3 scripts/prepare-signing.py
      - name: Archive and upload to App Store Connect
        run: |
          set -o pipefail
          mkdir -p build
          KEY_PATH="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          xcodebuild -project RideGuard.xcodeproj -scheme RideGuard -configuration Release -destination 'generic/platform=iOS' -archivePath build/RideGuard.xcarchive DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CURRENT_PROJECT_VERSION="$((100 + GITHUB_RUN_NUMBER))" CODE_SIGNING_ALLOWED=NO -allowProvisioningUpdates -authenticationKeyPath "$KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" archive 2>&1 | tee build/archive.log
          xcodebuild -exportArchive -archivePath build/RideGuard.xcarchive -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath build/export -allowProvisioningUpdates -authenticationKeyPath "$KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" 2>&1 | tee build/upload.log
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
      - name: Save build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: App-Store-build-diagnostics
          path: build/*.log
          retention-days: 7
