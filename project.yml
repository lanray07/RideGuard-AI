name: RideGuard
options:
  bundleIdPrefix: com.rideguard
  deploymentTarget:
    iOS: '17.0'
    watchOS: '10.0'
packages:
  RideGuardCore:
    path: .
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
    CODE_SIGN_STYLE: Automatic
targets:
  RideGuard:
    type: application
    platform: iOS
    preBuildScripts:
      - name: Normalize app icon
        script: 'sips --resampleHeightWidth 1024 1024 "$SRCROOT/Marketing/app-icon-master.png" --out "$SRCROOT/App/Assets.xcassets/AppIcon.appiconset/AppIcon.png" >/dev/null'
        basedOnDependencyAnalysis: false
    sources:
      - path: App
      - path: Shared
    dependencies:
      - package: RideGuardCore
      - target: RideGuardWatch
        embed: true
      - target: RideGuardActivity
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rideguard.app
        TARGETED_DEVICE_FAMILY: '1,2'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Configuration/Info.plist
      properties:
        CFBundleDisplayName: RideGuard AI
        UILaunchScreen: {}
        NSLocationWhenInUseUsageDescription: Your location helps plan a ride, record hazards, and track a ride you start.
        NSFaceIDUsageDescription: Confirm it is you before exporting sensitive ride history and saved locations.
        NSLocationAlwaysAndWhenInUseUsageDescription: During a ride you start, location can keep ride progress updated while the screen is locked. Sharing requires a separate choice.
        UIBackgroundModes: [location]
        NSSupportsLiveActivities: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
  RideGuardWatch:
    type: application
    platform: watchOS
    sources:
      - path: Watch
    dependencies:
      - package: RideGuardCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rideguard.app.watchkitapp
    info:
      path: Configuration/Watch-Info.plist
      properties:
        CFBundleDisplayName: RideGuard
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.rideguard.app
  RideGuardActivity:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rideguard.app.activity
    info:
      path: Configuration/Activity-Info.plist
      properties:
        CFBundleDisplayName: RideGuard Ride
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
schemes:
  RideGuard:
    build:
      targets:
        RideGuard: all
    run:
      config: Debug
